[project]
name = "aiind"
version = "0.1.0"
description = "AI-cycle leading indicators: GPU rental prices, LLM token prices, supply chain and capex, collected daily into parquet."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=16",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
