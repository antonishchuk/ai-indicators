name: collect

on:
  schedule:
    - cron: "15 6 * * *"   # daily 06:15 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "data/**"
      - "site/data/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Collect
        continue-on-error: true   # a dead source must not block the site build; failures land in data/run_status.json
        run: python -m aiind.run

      - name: Build site
        run: python -m aiind.build_site

      - name: Commit data
        run: |
          git config user.name "ai-indicators bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
